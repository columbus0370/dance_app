name: Deploy Flutter Web (Staging)

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean Flutter cache
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /dance_app/staging/ -v 2>&1 | tail -100

      - name: Verify build artifacts
        run: |
          if [ -d "build/web" ]; then
            echo "Build directory exists"
            ls -la build/web | head -20
          else
            echo "ERROR: build/web directory not found!"
            exit 1
          fi

      - name: Deploy to Staging
        uses: peaceiris/actions-gh-pages@v4.3.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          destination_dir: staging
          cname: ""
          force_orphan: false
